name: CCTV Auto Update

on:
  push:
    branches: [main]
    paths:
      - "update_cctv.py"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: cctv-auto-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WINDY_API_KEY: ${{ secrets.WINDY_API_KEY || secrets.CCTV_WINDY_API_KEY || secrets.WINDY_WEBCAMS_API_KEY }}
      CCTV_RADIUS_KM: "30"

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Update CCTV GeoJSON
        run: python update_cctv.py
      - name: Commit updated GeoJSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cctv_windy_updated.geojson
          git diff --cached --quiet && exit 0
          git commit -m "Update Windy CCTV near industrial estates"
          git push
